# Demo run config — `lens run examples/lending_demo/lens-run.yaml` from the
# repo root (paths resolve relative to this file).
entity_col: deal_id
snapshot_col: snapshot_date

sources:
  loan_pool: data/loan_pool.csv
  senior_debt: data/senior_debt.csv
  deal_terms: data/deal_terms.csv

wiki_root: wiki
output_dir: out

checks:
  - name: null_check
    sources: [loan_pool] # only loan_pool has a status column
    params: { fields: [status] }
  - name: stl_residual
    sources: [senior_debt, loan_pool]
    params: { field: balance, period: 4 }

cross_checks:
  - cross_source_wiki

rca:
  enabled: true
  severity_floor: error
  # The producing code lives in a separate data-pipeline repo, declared on the
  # lineage page (repo_url + recent_changes). RCA links the pipeline commit
  # from that declaration; it does not point at LENS's own source.
  repo_root: ../..
  # Token / cost controls (defaults shown; uncomment to override):
  # reuse_prior_rca: true             # reuse an ongoing finding's prior hypothesis (no LLM call)
  # model: sonnet                     # tier alias for the bulk (null = session default)
  # escalate_model: opus              # stronger model for critical findings (null = off)
  # escalate_severity: critical       # severity at/above which to escalate
  # max_investigations: 10            # hard cap on NEW RCA calls per run
  # sample_rows: 5                    # data rows per prompt (context size)
  # max_commits: 5                    # commits per producing path

feedback:
  path: out/feedback.jsonl
  expiry_days: 90

brief:
  dataset_label: "Northwind Capital — lending portfolio"
  top_n: 5
